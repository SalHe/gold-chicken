name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 只允许一个发布任务在跑，新的推送取消旧的
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Test
        id: test
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log

      # 测试失败时也把输出写到 job summary，方便在 Actions 页面上直接看
      - name: Test log
        if: always()
        run: |
          {
            echo '### 测试日志（末尾 400 行）'
            echo '```'
            tail -n 400 test.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 再挑出关键行写成注解：注解能用公开 API 读取，
          # 没登录 GitHub 时也能定位失败用例。
          if [ "${{ steps.test.outcome }}" != "success" ]; then
            grep -E "FAIL |Test Files .*failed|AssertionError|Error: |timed out" test.log 2>/dev/null \
              | head -n 10 \
              | while IFS= read -r line; do
                  line=${line//'%'/'%25'}
                  line=${line//$'\r'/'%0D'}
                  line=${line//$'\n'/'%0A'}
                  echo "::error title=Test failure::$line"
                done
          fi

      - name: Build
        run: npm run build

      - name: Collect artifact
        run: |
          mkdir -p dist
          cp index.html dist/
          touch dist/.nojekyll

      # 用一个全新的孤立提交推到 gh-pages，历史不累积
      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init --quiet
          git checkout --quiet -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "deploy ${GITHUB_SHA}"
          git push --force --quiet \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
